period_end: "2025-03-31"
model_version: tier_kmeans_v1     # ditulis ke JSON model, tampil di UI (FR-TIER-02)
paths:
  raw_excel_dir: ../data/raw/Financial_Statement_2025_Q2
  raw_csv: ../data/processed/raw_bei.csv
  features_csv: ../data/processed/features.csv
  excluded_log: ../data/processed/excluded_rows.csv
  model_out: models/tier_kmeans.json
  model_export: ../backend/models/tier_kmeans.json
  reports_dir: reports
  parser_output_dir: ../data/processed/parser_output
  ground_truth_dir: ../data/ground_truth/bei_excel
  bei_excel_dir: ../data/raw/bei_excel
# Fitur klaster final (Bagian 6.2 Brief Tahap 2): ocf_to_assets menggantikan cash_conversion agar emiten rugi tetap masuk sampel
features: [roa, roe, liability_to_asset, net_margin, current_ratio, revenue_growth, ocf_to_assets]
exclude_tickers: [SMGR]        # emiten demo tidak ikut dilatih (out-of-sample)
holdout_ratio: 0.1
winsorize: [0.02, 0.98]
balance_tolerance: 1
kmeans: { k: 3, seeds: [0, 1, 2, 3, 4], n_init: 20 }
gmm: { n_components: 3 }
